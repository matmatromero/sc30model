<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>STEPH CURRY PREDICTOR</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #fef9f4;
      display: flex;
      justify-content: center;
      padding-top: 40px;
    }
    .container {
      background-color: white;
      padding: 30px;
      border-radius: 12px;
      width: 600px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
    }
    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 25px;
    }
    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px 20px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }
    input, select {
      width: 100%;
      padding: 8px;
      font-size: 14px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .full-width {
      grid-column: span 2;
    }
    .radio-group {
      display: flex;
      gap: 15px;
      align-items: center;
      padding-top: 5px;
    }
    .submit-btn {
      background-color: #2c3e50;
      color: white;
      font-weight: bold;
      padding: 10px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
    }
    .submit-btn:hover {
      background-color: #1a252f;
    }
    .prediction {
      text-align: center;
      margin-top: 20px;
      font-size: 18px;
      color: #1a252f;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>STEPH CURRY PREDICTOR</h2>
    <form method="POST" action="/form_predict#result">
      {% for field in ["FG", "FGA", "FG%", "3P", "3PA", "3P%", "2P", "2PA", "2P%", "eFG%", "FT", "FTA", "TOV", "PF", "GmSc"] %}
      <div>
        <label for="{{ field }}">{{ field }}</label>
        <input type="number" name="{{ field }}" step="any" required value="{{ request.form.get(field, '') }}">
      </div>
      {% endfor %}

      <!-- Location -->
      <div class="full-width">
        <label>Location</label>
        <div class="radio-group">
          <label>
            <input type="radio" name="designation" value="home"
              {% if request.form.get('designation', 'home') == 'home' %}checked{% endif %}> Home
          </label>
          <label>
            <input type="radio" name="designation" value="away"
              {% if request.form.get('designation') == 'away' %}checked{% endif %}> Away
          </label>
        </div>
      </div>

      <!-- Opponent -->
      <div class="full-width">
        <label for="opponent">Opponent</label>
        <select name="opponent" required>
          <option value="" disabled {% if not request.form.get('opponent') %}selected{% endif %}>Select opponent</option>
          {% for team in ["ATL","BOS","BRK","CHI","CHO","CLE","DAL","DEN","DET","GSW","HOU","IND","LAC","LAL","MEM","MIA","MIL","MIN","NOP","NYK","OKC","ORL","PHI","PHO","POR","SAC","SAS","TOR","UTA","WAS"] %}
          <option value="{{ team }}" {% if request.form.get('opponent') == team %}selected{% endif %}>{{ team }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Submit -->
      <div class="full-width">
        <button type="submit" class="submit-btn">Predict</button>
      </div>
    </form>

    {% if prediction is not none %}
    <div class="prediction" id="result">
      <strong>Prediction:</strong> {{ prediction }}
    </div>
    {% endif %}
  </div>
</body>
</html>
